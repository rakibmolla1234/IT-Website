<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Your Cart</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
   <div class="container">
      <h2 class="text-center mb-4">🛒 Your cart</h2>
      <div class="card shadow-lg">
         <div class="card-header bg-dark text-white">
            <h5>Cart Summary</h5>
         </div>
         <div class="card-body">
            <ul class="list-group lis-group-flush" id="cartItems"></ul>
         </div>
         <div class="card-footer d-flex justify-content-between align-items-center">
            <h5>Total: <span id="cartTotal">0.00</span></h5>
            <a href="checkout.html" class="btn btn-success" id="checkoutBtn">🧾 Proceed to Checkout</a>
         </div>
      </div>

      <div id="emptyCartMessage" class="alert alert-warning mt-4 text-center d-none">
         <h5>Your cart is currently empty</h5>
         <a href="index.html" class="btn btn-primary mt-2">← Back to Home</a>
      </div>
   </div>

   <script>
      const cartItemsEl = document.getElementById("cartItems");
      const cartTotalEl = document.getElementById("cartTotal");
      const checkoutBtn = document.getElementById("checkoutBtn");
      const emptyCartMessage = document.getElementById("emptyCartMessage");

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function renderCart() {
         cartItemsEl.innerHTML = "";
         let total = 0;

         if (cart.length === 0) {
            document.querySelector(".card").classList.add("d-none");
            emptyCartMessage.classList.remove("d-none");
            return;
         }

         cart.forEach((item, index) => {
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML = `
            <div>
               <strong>${item.name}</strong>
               <br>
               <small class="text-muted">${item.type.toUpperCase()}</small>
            </div>
            <div>
               <span class="me-3">$${item.price.toFixed(2)}</span>
               <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">🗑️</button>
            </div>
         `;
            cartItemsEl.appendChild(li);
            total += item.price;
         });

         cartTotalEl.innerText = total.toFixed(2);
      }

      function removeItem(index) {
         cart.splice(index, 1);
         localStorage.setItem("cart", JSON.stringify(cart));
         renderCart();
      }

      renderCart();
   </script>
</body>

</html>

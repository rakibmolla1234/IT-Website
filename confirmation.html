<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Order Confirmation</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
   <div class="container py-5 text-center">
      <h2 class="mb-3 text-success">🎉 Your Order Was Successful!</h2>
      <p class="lead">Thank you for your purchase.</p>
      <h4>🧾 Order ID: <span id="orderId"></span></h4>
      <a href="index.html" class="btn btn-primary mt-4">← Back to Home</a>
   </div>

   <script>
      const orderId = localStorage.getItem("orderId") || "ORD-XXXX";
      document.getElementById("orderId").innerText = orderId;
      localStorage.removeItem("orderId");
   </script>
</body>

</html>
